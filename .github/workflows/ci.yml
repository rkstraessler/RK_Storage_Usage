name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: storageusage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate app and release package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source, metadata and scripts
        run: bash scripts/validate-source.sh

      - name: Validate the official App Store schema
        run: |
          curl --fail --silent --show-error --location \
            https://apps.nextcloud.com/schema/apps/info.xsd \
            --output "${RUNNER_TEMP}/nextcloud-info.xsd"
          php scripts/validate-app-metadata.php "${RUNNER_TEMP}/nextcloud-info.xsd"

      - name: Validate package structure
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC2016
          version="$(php -r '$xml = simplexml_load_file("appinfo/info.xml"); echo trim((string) $xml->version);')"
          stage_root="${RUNNER_TEMP}/storageusage-ci-stage"
          output_directory="${RUNNER_TEMP}/storageusage-ci-output"

          bash scripts/package-release.sh stage "${version}" "${stage_root}"
          printf '%s\n' '{"hashes":{"/ci-placeholder":"ci"},"certificate":"ci","signature":"ci"}' \
            > "${stage_root}/storageusage/appinfo/signature.json"
          bash scripts/package-release.sh package \
            "${version}" \
            "${stage_root}" \
            "${output_directory}" \
            "$(git show -s --format=%ct HEAD)"

          tar -tzf \
            "${output_directory}/storageusage-v${version}.tar.gz" \
            storageusage/appinfo/info.xml \
            >/dev/null
          unzip -Z1 \
            "${output_directory}/storageusage-v${version}.zip" \
            storageusage/appinfo/info.xml \
            >/dev/null

  compatibility:
    name: Compatibility (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Moving tags deliberately catch new stable Nextcloud releases.
        image:
          - nextcloud:34-apache
          - nextcloud:apache

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test installation, settings and public API
        env:
          NEXTCLOUD_TEST_IMAGE: ${{ matrix.image }}
        run: bash scripts/test-nextcloud-compatibility.sh "${NEXTCLOUD_TEST_IMAGE}"
